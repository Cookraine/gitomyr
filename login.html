<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизація | Проєкт для Git</title>
    <style>
	body {
            /* Змінено фон на темний графіт */
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #eeeeee;
        }
        .login-container {
            /* Змінено колір картки та додано більше закруглення */
            background-color: #16213e;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 320px;
            border: 1px solid #0f3460;
        }
        h2 {
            text-align: center;
            color: #4ecca3; /* Новий акцентний колір для заголовка */
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        label {
            display: block;
            margin-bottom: 0.6rem;
            color: #95a5a6;
            font-size: 0.9rem;
        }
        input {
            width: 100%;
            padding: 0.7rem;
            background-color: #0f3460;
            border: 1px solid #16213e;
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #4ecca3;
        }
        button {
            width: 100%;
            padding: 0.8rem;
            background-color: #4ecca3; /* Змінено з синього на смарагдовий */
            border: none;
            border-radius: 8px;
            color: #1a1a2e;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Вхід у систему</h2>
    <form>
        <div class="form-group">
            <label for="username">Логін</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit">Увійти</button>
    </form>
</div>

</body>
</html>
