networks:
  default:
    name: gitomyr.network

services:
  web:
    container_name: gitomyr.web
    image: nginx:1.29-trixie
    restart: always
    env_file:
    - .env
    ports:
      - "${APP_HTTP}:80"
    volumes:
      - ./html:/var/www/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
