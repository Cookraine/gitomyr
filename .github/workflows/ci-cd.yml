name: Gitomyr CI/CD Pipeline

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ main ]

jobs:
  # === ЕТАП 1: БЕЗПЕРЕРВНА ІНТЕГРАЦІЯ (CI) ===
  test-and-build:
    runs-on: ubuntu-latest

    # Піднімаємо MariaDB спеціально для тестів
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: gitomyr_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, pdo_mysql
          coverage: none

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install PHP Dependencies (Composer)
        working-directory: ./src # Вказуємо папку, де лежить Laravel
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: 📦 Install Node Dependencies & Build React
        working-directory: ./src
        run: |
          npm ci
          npm run build

      - name: ⚙️ Prepare Environment Variables
        working-directory: ./src
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: 🗄️ Run Database Migrations
        working-directory: ./src
        env:
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: gitomyr_test
          DB_USERNAME: root
          DB_PASSWORD: root_password
        run: php artisan migrate --force

      - name: 🧪 Run Tests (PHPUnit)
        working-directory: ./src
        env:
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: gitomyr_test
          DB_USERNAME: root
          DB_PASSWORD: root_password
        run: php artisan test

# === ЕТАП 2: БЕЗПЕРЕРВНЕ РОЗГОРТАННЯ (CD) ===
  publish:
    needs: test-and-build # Запускається ТІЛЬКИ якщо job 'test' завершився успішно
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' # Пушимо образи тільки з гілки dev
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔑 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }} # Твій логін на GitHub
          password: ${{ secrets.GITHUB_TOKEN }} # Автоматичний токен (нічого створювати не треба)

      - name: 🏷️ Prepare Docker Tag
        id: prep
        run: |
          # Беремо назву репозиторію і переводимо в нижній регістр засобами Bash
          REPO_NAME="ghcr.io/${{ github.repository }}"
          echo "image=${REPO_NAME,,}" >> $GITHUB_OUTPUT

      - name: 🐳 Build and Push App Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/php/Dockerfile
          push: true
          # Використовуємо результат попереднього кроку через 'steps.prep.outputs'
          tags: ${{ steps.prep.outputs.image }}:latest
